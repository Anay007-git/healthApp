<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#FF671F"/>

  <!-- Glasses frame — left lens -->
  <rect x="5" y="22" width="22" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- Glasses frame — right lens -->
  <rect x="37" y="22" width="22" height="18" rx="9" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- Bridge connecting the two lenses -->
  <path d="M27 31 Q32 28 37 31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Left temple arm -->
  <path d="M5 31 L2 31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right temple arm -->
  <path d="M59 31 L62 31" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Orange tint inside lenses (glass effect) -->
  <rect x="7" y="24" width="18" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>
  <rect x="39" y="24" width="18" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Shine glint on left lens -->
  <path d="M10 27 Q13 25 15 27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <!-- Shine glint on right lens -->
  <path d="M42 27 Q45 25 47 27" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>
